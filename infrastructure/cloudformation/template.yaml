AWSTemplateFormatVersion: '2010-09-09'
Description: >
  CryptoStream Lakehouse - S3 data lake, Glue catalog databases, Bronze
  external table, Athena workgroup, and IAM permissions for Kafka Connect
  and dbt-athena.

Parameters:
  ProjectName:
    Type: String
    Default: cryptostream
  EnvironmentName:
    Type: String
    Default: dev

Resources:

  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-${EnvironmentName}-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: TransitionToInfrequentAccess
            Status: Enabled
            Transitions:
              - TransitionInDays: 30
                StorageClass: STANDARD_IA
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  GlueDatabaseBronze:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: cryptostream_bronze

  GlueDatabaseSilver:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: cryptostream_silver

  GlueDatabaseGold:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: cryptostream_gold

  BronzeMarketTradesTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabaseBronze
      TableInput:
        Name: market_trades
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: json
          'projection.enabled': 'true'
          'projection.year.type': 'integer'
          'projection.year.range': '2026,2030'
          'projection.month.type': 'integer'
          'projection.month.range': '1,12'
          'projection.month.digits': '2'
          'projection.day.type': 'integer'
          'projection.day.range': '1,31'
          'projection.day.digits': '2'
          'projection.hour.type': 'integer'
          'projection.hour.range': '0,23'
          'projection.hour.digits': '2'
          'storage.location.template': !Sub 's3://${DataBucket}/bronze/market_trades/year=${!year}/month=${!month}/day=${!day}/hour=${!hour}/'
        PartitionKeys:
          - Name: year
            Type: string
          - Name: month
            Type: string
          - Name: day
            Type: string
          - Name: hour
            Type: string
        StorageDescriptor:
          Location: !Sub 's3://${DataBucket}/bronze/market_trades/'
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          Compressed: true
          SerdeInfo:
            SerializationLibrary: org.openx.data.jsonserde.JsonSerDe
          Columns:
            - Name: event_id
              Type: string
            - Name: schema_version
              Type: int
            - Name: source
              Type: string
            - Name: product_id
              Type: string
            - Name: trade_id
              Type: string
            - Name: price
              Type: string
            - Name: size
              Type: string
            - Name: maker_side
              Type: string
            - Name: trade_time
              Type: string
            - Name: ingested_at
              Type: string

  AthenaWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: cryptostream-dev
      State: ENABLED
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: true
        ResultConfiguration:
          OutputLocation: !Sub 's3://${DataBucket}/athena-results/'

  KafkaConnectUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub '${ProjectName}-${EnvironmentName}-kafka-connect'
      Policies:
        - PolicyName: KafkaConnectS3Write
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:AbortMultipartUpload
                Resource: !Sub 'arn:aws:s3:::${DataBucket}/bronze/*'
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !Sub 'arn:aws:s3:::${DataBucket}'
                Condition:
                  StringLike:
                    s3:prefix: 'bronze/*'

  DbtAthenaUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub '${ProjectName}-${EnvironmentName}-dbt-athena'
      Policies:
        - PolicyName: DbtAthenaAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - athena:StartQueryExecution
                  - athena:GetQueryExecution
                  - athena:GetQueryResults
                  - athena:StopQueryExecution
                  - athena:GetWorkGroup
                Resource: '*'
              - Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetDatabases
                  - glue:GetTable
                  - glue:GetTables
                  - glue:GetPartition
                  - glue:GetPartitions
                  - glue:BatchGetPartition
                  - glue:CreateTable
                  - glue:UpdateTable
                  - glue:DeleteTable
                  - glue:BatchCreatePartition
                  - glue:BatchDeletePartition
                Resource:
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog'
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/cryptostream_bronze'
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/cryptostream_silver'
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/cryptostream_gold'
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/cryptostream_bronze/*'
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/cryptostream_silver/*'
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/cryptostream_gold/*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub 'arn:aws:s3:::${DataBucket}/bronze/*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub 'arn:aws:s3:::${DataBucket}/silver/*'
                  - !Sub 'arn:aws:s3:::${DataBucket}/gold/*'
                  - !Sub 'arn:aws:s3:::${DataBucket}/athena-results/*'
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !Sub 'arn:aws:s3:::${DataBucket}'

Outputs:
  BucketName:
    Value: !Ref DataBucket
  AthenaWorkGroupName:
    Value: !Ref AthenaWorkGroup
  GlueDatabaseBronzeName:
    Value: !Ref GlueDatabaseBronze
  GlueDatabaseSilverName:
    Value: !Ref GlueDatabaseSilver
  GlueDatabaseGoldName:
    Value: !Ref GlueDatabaseGold
  KafkaConnectUserName:
    Value: !Ref KafkaConnectUser
  DbtAthenaUserName:
    Value: !Ref DbtAthenaUser
